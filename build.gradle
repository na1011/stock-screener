plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'stock-screener'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// QueryDSL mainline(com.querydsl)은 이 스택에서 런타임에 깨진다.
// mainline 5.1.0의 AbstractHibernateQuery가 Hibernate 7에서 제거된
// Query.setFlushMode(org.hibernate.FlushMode)를 호출해 NoSuchMethodError가 난다.
// 컴파일·Q클래스 생성·컨텍스트 기동은 모두 성공하고 쿼리 실행 시점에만 드러난다.
// Boot 4.1의 BOM이 아직 querydsl.version=5.1.0을 고정하고 있어 무심코 쓰면 걸린다.
// 여기서 group 자체를 차단해 런타임 지뢰를 빌드 타임 에러로 바꾼다. ADR-0001 참조.
configurations.all {
    exclude group: 'com.querydsl'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // QueryDSL — OpenFeign 포크. classifier 규칙이 7.x에서 역전되었다:
    // querydsl-jpa는 classifier를 떼고(:jakarta는 404), querydsl-apt는 붙인다.
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.5'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.5:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // Spring Batch — 초기 적재의 재시작성이 도입 근거다. 850종목 × 2년 시세를 일일 쿼터가
    // 있는 소스에서 받으므로 한 번에 끝나지 않는 것이 정상 시나리오이고, "어디까지 했는가"를
    // 직접 만들면 그것이 곧 저품질 JobRepository가 된다. ADR-0005 참조.
    // 메타데이터 스키마는 Boot의 자동 초기화가 아니라 Flyway가 관리한다(V6).
    implementation 'org.springframework.boot:spring-boot-starter-batch'

    // Boot 4는 Flyway 자동설정을 별도 모듈로 분리했다. flyway-core만 넣으면
    // 클래스패스에는 있지만 자동설정이 없어 마이그레이션이 조용히 실행되지 않는다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // flyway-core는 PostgreSQL 지원을 번들하지 않는다. 이것이 없으면 인식하지 못한다.
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // Boot 4는 테스트 슬라이스를 모듈별 스타터로 분리했다.
    // @DataJpaTest는 spring-boot-starter-test에 없고 여기에 있다.
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // JobLauncherTestUtils. 재시작성은 실제 JobRepository로만 검증할 수 있다.
    testImplementation 'org.springframework.batch:spring-batch-test'
    // QueryDSL 프로브 엔티티가 테스트 소스에 있으므로 Q클래스도 테스트 컴파일에서 생성한다.
    // 프로브는 도메인이 아니라 검증 도구이므로 운영 소스·스키마에 두지 않는다.
    testAnnotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.5:jakarta'
    testAnnotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    testAnnotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()
}
