plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com'
version = '0.0.1-SNAPSHOT'
description = 'stock-screener'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

// QueryDSL mainline(com.querydsl)은 이 스택에서 런타임에 깨진다.
// mainline 5.1.0의 AbstractHibernateQuery가 Hibernate 7에서 제거된
// Query.setFlushMode(org.hibernate.FlushMode)를 호출해 NoSuchMethodError가 난다.
// 컴파일·Q클래스 생성·컨텍스트 기동은 모두 성공하고 쿼리 실행 시점에만 드러난다.
// Boot 4.1의 BOM이 아직 querydsl.version=5.1.0을 고정하고 있어 무심코 쓰면 걸린다.
// 여기서 group 자체를 차단해 런타임 지뢰를 빌드 타임 에러로 바꾼다. ADR-0001 참조.
configurations.all {
    exclude group: 'com.querydsl'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'

    // 이메일 알림. spec §8이 "이메일과 메신저 두 채널 모두"를 요구하므로 메신저 웹훅만으로는
    // 수용 기준을 못 채운다. 메신저는 RestClient로 충분하지만 SMTP는 스타터가 필요하다.
    // spring.mail.host가 없으면 JavaMailSender 빈이 만들어지지 않으므로, 자격증명 없이도
    // 기동해야 하는 전제는 AlertConfig가 ObjectProvider로 받아 지킨다. ADR-0025 참조.
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // QueryDSL — OpenFeign 포크. classifier 규칙이 7.x에서 역전되었다:
    // querydsl-jpa는 classifier를 떼고(:jakarta는 404), querydsl-apt는 붙인다.
    implementation 'io.github.openfeign.querydsl:querydsl-jpa:7.5'
    annotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.5:jakarta'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'

    // 재시도 백오프(RATE_LIMITED·TRANSIENT). Spring Batch를 걷은 뒤(ADR-0075) 이것이 유일한
    // 경로다. 빠지면 깨지는 것은 컴파일이 아니라 새벽 배치의 재시도 동작이다.
    //
    // MUST: 버전을 여기 박는다. Boot의 BOM은 이것을 관리하지 않고 **spring-batch의 BOM이
    // 주고 있었다** — 아티팩트를 직접 선언해 두었어도 버전은 전이였고, Batch를 걷자
    // `Could not find ...spring-retry:.`로 컴파일이 멈췄다. 2.0.13은 걷기 직전에 실제로
    // 해석되던 값이다.
    implementation 'org.springframework.retry:spring-retry:2.0.13'

    // Boot 4는 Flyway 자동설정을 별도 모듈로 분리했다. flyway-core만 넣으면
    // 클래스패스에는 있지만 자동설정이 없어 마이그레이션이 조용히 실행되지 않는다.
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    // flyway-core는 PostgreSQL 지원을 번들하지 않는다. 이것이 없으면 인식하지 못한다.
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Sentry — MUST: Boot 4 전용 아티팩트다. 이름이 비슷한 것이 넷 있고 고르는 순간 갈린다.
    //   sentry-spring-boot-starter          → Boot 2 (javax)
    //   sentry-spring-boot-starter-jakarta  → Boot 3   ← 2026-08-08에 이것을 골라 앱이 죽었다
    //   sentry-spring-boot-4-starter        → Boot 4   ← 이것
    // Boot 3판은 spring-boot-starter 3.5.0에 컴파일돼 있어, DSN이 실린 채 기동하면
    // SentrySpringVersionChecker가 !Incompatible Spring Boot Version detected!를 찍은 뒤
    // ClassNotFoundException: org.springframework.boot.web.client.RestClientCustomizer로
    // 컨텍스트가 죽는다. Boot 4판은 그 자리에 org.springframework.boot.restclient.
    // RestClientCustomizer(Boot 4 패키지)를 쓰고, 이 POM은 spring-boot-starter 4.1.0을
    // 직접 의존한다. ADR-0030 참조.
    //
    // Boot BOM이 io.sentry를 관리하지 않으므로 버전을 명시한다.
    implementation 'io.sentry:sentry-spring-boot-4-starter:8.52.0'

    // actuator — /actuator/health 하나를 위해 넣는다. launchd가 "앱이 떴는가"를 물을 곳이
    // 필요하고, 지금은 포트가 열렸는지밖에 볼 수 없어 DB가 죽은 채 뜬 앱과 구분되지 않는다.
    // 노출은 health만이고 나머지는 SecurityConfig가 관리자로 잠근다. ADR-0031 참조.
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    // Boot 4는 테스트 슬라이스를 모듈별 스타터로 분리했다.
    // @DataJpaTest는 spring-boot-starter-test에 없고 여기에 있다.
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    // 실제 소켓을 열어 RestClient를 통과시킨다. Mockito로 RestClient를 목킹하면
    // 타임아웃·상태코드·봉투 파싱 같은 에러 매핑이 전혀 검증되지 않는다.
    // WireMock은 Jetty 전체를 끌어와 무겁고, Docker가 없어 컨테이너 기반은 배제된다.
    // 버전을 명시하는 이유는 Boot 4.1 BOM이 okhttp3를 관리하지 않기 때문이다(해결 실패).
    // 5.x는 패키지 구조가 바뀌었으므로 고전 API를 쓰는 4.12.0에 고정한다.
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    // QueryDSL 프로브 엔티티가 테스트 소스에 있으므로 Q클래스도 테스트 컴파일에서 생성한다.
    // 프로브는 도메인이 아니라 검증 도구이므로 운영 소스·스키마에 두지 않는다.
    testAnnotationProcessor 'io.github.openfeign.querydsl:querydsl-apt:7.5:jakarta'
    testAnnotationProcessor 'jakarta.persistence:jakarta.persistence-api'
    testAnnotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

// .env(gitignore 대상)를 읽어 실행 태스크에 주입한다. 이것이 없으면 .env에 값을 적어도
// 아무 데도 도달하지 않는다 — Spring Boot는 .env를 읽지 않고, 이 빌드에 dotenv 의존성도 없다.
// 그런데 실패가 조용하다: application.yaml의 자리표시자 기본값(not-configured) 때문에
// 애플리케이션은 정상 기동하고 브라우저 로그인만 안 되므로, 원인이 "값을 안 적었나"인지
// "값이 안 실렸나"인지 구분되지 않는다. 그래서 매번 `source .env`를 기억하는 대신 빌드가 싣는다.
//
// MUST NOT: test 태스크에 주입하지 않는다. 실제 키가 있으면 @ConditionalOnApiKey 어댑터가
// 등록되어 단위 테스트의 빈 구성 자체가 바뀐다. 단위 테스트는 외부 호출 0건이 전제이고,
// 키 유무로 결과가 달라지면 CI와 로컬이 어긋난다. 키가 필요한 것은 bootRun과 liveTest뿐이다.
ext.loadDotEnvFrom = { File envFile ->
    if (envFile == null || !envFile.exists()) {
        return [:]
    }
    def loaded = [:]
    envFile.eachLine('UTF-8') { rawLine ->
        def line = rawLine.trim()
        if (line.isEmpty() || line.startsWith('#')) {
            return
        }
        if (line.startsWith('export ')) {
            line = line.substring('export '.length()).trim()
        }
        def sep = line.indexOf('=')
        if (sep <= 0) {
            return
        }
        def key = line.substring(0, sep).trim()
        def value = line.substring(sep + 1).trim()
        // 값을 감싼 따옴표는 셸이 벗겨주는 부분이라 여기서도 벗긴다.
        if (value.length() >= 2 && (
                (value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'")))) {
            value = value.substring(1, value.length() - 1)
        }
        loaded[key] = value
    }
    return loaded
}

ext.loadDotEnv = { loadDotEnvFrom(rootProject.file('.env')) }

// 실제 셸 환경변수가 .env를 이긴다. 일회성 오버라이드를 파일 수정 없이 하기 위해서다.
ext.applyDotEnv = { Task task ->
    def loaded = loadDotEnv()
    if (loaded.isEmpty()) {
        return
    }
    def applied = loaded.findAll { k, v -> System.getenv(k) == null }
    applied.each { k, v -> task.environment(k, v) }
    // MUST NOT: 값을 로그에 남기지 않는다. 키 이름만으로 "실렸는가"는 판정된다.
    task.doFirst {
        logger.lifecycle(".env에서 ${applied.size()}개 주입: ${applied.keySet().sort().join(', ')}")
    }
}

tasks.named('bootRun') {
    applyDotEnv(it)
}

// "값을 안 적었나, 값이 안 실렸나"를 앱 기동 없이 가른다. 이 구분이 안 되는 것이
// .env 주입 실패의 진짜 비용이었다. 값은 절대 출력하지 않는다 — 이름과 설정 여부만 본다.
tasks.register('checkEnv') {
    group = 'verification'
    description = '.env가 실렸는지 키 이름으로만 확인한다. 값은 출력하지 않는다.'
    doLast {
        def loaded = loadDotEnv()
        if (loaded.isEmpty()) {
            println '.env가 없거나 비어 있다.'
            return
        }
        // 자리표시자를 실제 값으로 착각하는 것이 가장 흔한 실패다. .env.example의
        // 값과 같으면 "복사만 하고 안 채웠다"는 뜻이므로 미설정으로 취급한다.
        def placeholders = [:]
        def exampleFile = rootProject.file('.env.example')
        if (exampleFile.exists()) {
            placeholders = loadDotEnvFrom(exampleFile)
        }
        println '.env 키 상태 (값은 표시하지 않음):'
        loaded.keySet().sort().each { key ->
            def value = loaded[key]
            def status
            if (value == null || value.isEmpty()) {
                status = '빈 값'
            } else if (placeholders[key] != null && placeholders[key] == value) {
                status = '자리표시자 그대로 — 채워지지 않음'
            } else {
                status = "설정됨 (${value.length()}자)"
            }
            def overridden = System.getenv(key) != null ? ' [셸 환경변수가 우선함]' : ''
            println "  ${key}: ${status}${overridden}"
        }

        // 키가 아예 없으면 위 루프는 아무 말도 하지 않는다. "안 적었다"가 침묵으로 나타나면
        // "적었는데 안 실렸다"와 구분되지 않아 이 태스크의 목적 자체가 무너진다.
        // 기대 키 목록의 정본은 .env.example 하나로 둔다 — build.gradle에 또 적으면 반드시 어긋난다.
        def missing = placeholders.keySet().findAll { !loaded.containsKey(it) }.sort()
        if (!missing.isEmpty()) {
            println '\n.env.example에 있으나 .env에 없는 키 (기본값이 있거나 아직 미발급이면 정상):'
            missing.each { key ->
                def inShell = System.getenv(key) != null ? ' [셸 환경변수에는 있음]' : ''
                println "  ${key}${inShell}"
            }
        }

        // 구조 진단. "파일엔 적었는데 파서가 못 본다"를 가르는 용도다 — 주석 처리됐는지,
        // '='가 빠졌는지, 키 이름에 오타가 있는지가 여기서만 드러난다.
        // MUST NOT: 값을 출력하지 않는다. 줄 번호·분류·길이만 낸다.
        println '\n.env 줄 구조 (값 미출력):'
        def lineNo = 0
        def unquotedSpaceKeys = []
        rootProject.file('.env').eachLine('UTF-8') { raw ->
            lineNo++
            def line = raw.trim()
            if (line.isEmpty()) {
                return
            }
            if (line.startsWith('#')) {
                println "  ${lineNo}: 주석 — 무시됨"
                return
            }
            def body = line.startsWith('export ') ? line.substring(7).trim() : line
            // 어느 줄이 구글 자격증명인지만 표시한다. 부분 문자열 포함 여부라 값은 새지 않는다.
            def marks = ['GOOGLE', 'CLIENT', 'SECRET', 'GOCSPX'].findAll {
                body.toUpperCase().contains(it)
            }
            def hint = marks.isEmpty() ? '' : "  ⟵ ${marks.join('/')} 포함"
            def sep = body.indexOf('=')
            if (sep <= 0) {
                println "  ${lineNo}: '='가 없어 무시됨 (${body.length()}자)${hint}"
                return
            }
            def rawValue = body.substring(sep + 1)
            // IMPORTANT — 값에 공백이 있는데 따옴표가 없으면 운영 기동이 통째로 죽는다.
            // ops/run-app.sh가 `set -euo pipefail` 아래 `set -a; . .env`로 읽으므로 공백 뒤
            // 조각이 명령으로 해석되어 exit 127이 되고, 그 뒤 줄의 키가 하나도 안 실린다.
            // 실측으로 한 번 앱이 내려갔다 — .env.example의 MUST만으로는 못 막았으므로
            // 여기서 잡는다. 값은 출력하지 않는다.
            def quoted = (rawValue.startsWith('"') && rawValue.endsWith('"'))
                    || (rawValue.startsWith("'") && rawValue.endsWith("'"))
            def unquotedSpace = rawValue.contains(' ') && !quoted
            if (unquotedSpace) {
                unquotedSpaceKeys << body.substring(0, sep).trim()
            }
            def warn = unquotedSpace ? '  ⟵ 🔴 공백이 있는데 따옴표가 없다' : ''
            println "  ${lineNo}: 키 '${body.substring(0, sep).trim()}' → 값 ${body.length() - sep - 1}자${hint}${warn}"
        }
        println "\n파일 크기: ${rootProject.file('.env').length()}바이트, 총 ${lineNo}줄"

        if (!unquotedSpaceKeys.isEmpty()) {
            throw new GradleException(
                    "값에 공백이 있는데 따옴표가 없는 키: ${unquotedSpaceKeys}\n" +
                    "  ops/run-app.sh가 `set -a; . .env`로 읽으므로 이대로면 운영 기동이 exit 127로 죽고,\n" +
                    "  그 뒤 줄의 키가 하나도 안 실린다. 값을 큰따옴표로 감싸라.")
        }
    }
}

// ── 프론트엔드 빌드 ──────────────────────────────────────────────
// frontend/의 Vite 번들을 classpath의 static/으로 넣어 bootJar 하나로 배포한다.
// 인증이 세션 쿠키 + XSRF-TOKEN 쿠키 기반이라 프론트와 API가 같은 오리진이어야 하고,
// 분리 배포하면 CORS·SameSite·allowCredentials를 전부 떠안는다. ADR-0018 참조.
def frontendDir = layout.projectDirectory.dir('frontend')

// npm은 Homebrew 경로(/opt/homebrew/bin)에 있는데 그 경로는 /etc/paths에 없다.
// 터미널에서 ./gradlew를 쓰면 셸 PATH가 따라오지만 IDE가 데몬을 띄우면 따라오지 않아
// "npm을 찾을 수 없다"가 된다. 그 실패는 프론트 코드와 무관한 곳에서 나타나므로 미리 가른다.
ext.resolveNpm = {
    def candidates = []
    def path = System.getenv('PATH')
    if (path) {
        path.split(File.pathSeparator).each { candidates << new File(it, 'npm') }
    }
    candidates << new File('/opt/homebrew/bin/npm')
    candidates << new File('/usr/local/bin/npm')
    def found = candidates.find { it.isFile() && it.canExecute() }
    if (found == null) {
        throw new GradleException('npm을 찾을 수 없다. Node 20 이상을 설치하거나 PATH에 npm을 넣어라.\n' +
                '프론트엔드 빌드를 건너뛰려면 -PskipFrontend를 준다(번들 없이 API만 뜬다).')
    }
    return found.absolutePath
}

tasks.register('frontendInstall', Exec) {
    group = 'frontend'
    description = 'npm ci로 프론트엔드 의존성을 설치한다.'
    workingDir = frontendDir
    commandLine 'npm', 'ci'
    doFirst { commandLine resolveNpm(), 'ci' }
    onlyIf { !project.hasProperty('skipFrontend') }

    inputs.file(frontendDir.file('package.json'))
    inputs.file(frontendDir.file('package-lock.json'))
    // node_modules 전체를 출력으로 잡으면 수천 개 파일을 스냅샷하느라 매 빌드가 느려진다.
    // npm이 설치 후 갱신하는 이 파일 하나가 같은 판정을 싸게 해준다.
    outputs.file(frontendDir.file('node_modules/.package-lock.json'))
}

tasks.register('frontendBuild', Exec) {
    group = 'frontend'
    description = '프론트엔드를 타입 검사하고 번들한다(frontend/dist).'
    dependsOn 'frontendInstall'
    workingDir = frontendDir
    commandLine 'npm', 'run', 'build'
    doFirst { commandLine resolveNpm(), 'run', 'build' }
    onlyIf { !project.hasProperty('skipFrontend') }

    // Vite의 envDir이 frontend/라 루트 .env를 읽지 않는다. 다만 Vite는 프로세스 환경변수의
    // VITE_ 접두 키를 .env 파일보다 **우선해서** 싣는다(loadEnv 실측). 그래서 주입 지점은
    // frontend/.env가 아니라 이 태스크의 환경이다 — 그 파일을 만들면 guard-secrets.sh가
    // 막기도 하고, 시크릿이 frontend/ 아래에 생기는 것 자체가 나쁘다.
    applyDotEnv(it)

    inputs.dir(frontendDir.dir('src'))
    inputs.file(frontendDir.file('index.html'))
    inputs.file(frontendDir.file('vite.config.ts'))
    inputs.file(frontendDir.file('tsconfig.json'))
    inputs.file(frontendDir.file('env.d.ts'))
    inputs.file(frontendDir.file('package-lock.json'))

    // IMPORTANT — 주입한 값을 입력으로 선언하지 않으면, 값만 바뀐 재빌드를 Gradle이
    // UP-TO-DATE로 판정해 **캐시된 옛 번들을 그대로 싣는다.** DSN을 채웠는데 번들에
    // 아무것도 안 들어가는 상태가 되고, 원인이 캐시라는 것은 드러나지 않는다.
    //
    // MUST NOT: 시크릿을 값으로 선언하지 않는다. Gradle은 입력 프로퍼티 값을 .gradle/ 아래
    // 태스크 이력에 그대로 직렬화한다. DSN은 쓰기 전용 공개 식별자라 값으로 둬도 되지만,
    // SENTRY_AUTH_TOKEN은 존재 여부만 넣는다 — "토큰이 생겼으니 다시 돌아라"는 판정에는
    // boolean으로 충분하다.
    def frontendEnv = loadDotEnv()
    def resolveEnv = { String key -> System.getenv(key) ?: frontendEnv[key] }
    inputs.property('VITE_SENTRY_DSN', resolveEnv('VITE_SENTRY_DSN') ?: '')
    inputs.property('SENTRY_ORG', resolveEnv('SENTRY_ORG') ?: '')
    inputs.property('SENTRY_PROJECT_FRONTEND', resolveEnv('SENTRY_PROJECT_FRONTEND') ?: '')
    inputs.property('sentryAuthTokenPresent', resolveEnv('SENTRY_AUTH_TOKEN') != null)

    outputs.dir(frontendDir.dir('dist'))
}

tasks.register('frontendTest', Exec) {
    group = 'verification'
    description = '프론트엔드 단위 테스트(Vitest).'
    dependsOn 'frontendInstall'
    workingDir = frontendDir
    commandLine 'npm', 'run', 'test:unit'
    doFirst { commandLine resolveNpm(), 'run', 'test:unit' }
    onlyIf { !project.hasProperty('skipFrontend') }

    inputs.dir(frontendDir.dir('src'))
    inputs.file(frontendDir.file('vite.config.ts'))
    inputs.file(frontendDir.file('package-lock.json'))
    // 계약 픽스처는 frontend/ 밖이라 위 세 줄로는 잡히지 않는다(ADR-0020).
    //
    // 지금 이 줄은 실제로는 작동하지 않는다 — 이 태스크는 **출력을 선언하지 않아 Gradle이
    // 항상 실행**하기 때문이다(`--info`가 "Task has not declared any outputs despite executing
    // actions"로 알려준다). 그래서 위 inputs 세 줄도 마찬가지로 놀고 있다.
    //
    // 그래도 적어 두는 이유는, 나중에 outputs를 선언해 이 태스크를 UP-TO-DATE 대상으로 만드는
    // 순간 이 줄이 없으면 픽스처만 고쳤을 때 프론트 쪽 대조가 조용히 건너뛰어지기 때문이다.
    // 그때 이 줄이 없다는 것을 알아차릴 방법이 없다.
    inputs.file(file('src/test/resources/contract/wire-contract.json'))
}

// 번들을 리소스로 실어야 bootRun·bootJar·build가 모두 같은 화면을 띄운다.
// 여기에 걸지 않고 bootJar에만 걸면 bootRun이 낡은 번들을 서빙하고,
// 그 차이는 "고쳤는데 왜 안 바뀌지"로만 드러난다.
tasks.named('processResources') {
    dependsOn 'frontendBuild'
    from(frontendDir.dir('dist')) {
        into 'static'
        // MUST: 소스맵을 배포물에 싣지 않는다. 실리면 /assets/index-a3f9.js.map이 그대로
        // 서빙되어 프론트 소스가 통째로 공개된다. vite.config.ts가 업로드 후 지우지만,
        // 업로드가 꺼져 있으면(슬러그·토큰 미발급) 맵이 dist에 남는다 — 즉 그 삭제만으로는
        // 지금 상태에서 아무것도 막지 못한다. 마지막 방어선은 여기다.
        exclude '**/*.map'
    }
}

// 관통테스트(@Tag("live"))는 실제 외부 API를 호출한다. 기본 test에서 제외하는 이유가 둘이다.
// 네트워크가 없거나 벤더가 점검 중이면 무관한 테스트까지 빨간불이 되고, 매 실행이
// 일일 쿼터를 태운다. 초기 적재에 쓸 쿼터를 테스트가 소진하면 안 된다.
tasks.register('liveTest', Test) {
    group = 'verification'
    description = '실제 외부 API를 호출하는 관통테스트. 키가 없으면 각 테스트가 스스로 스킵한다.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'live'
    }
    // 관통테스트는 실제 키를 쓰는 것이 목적이므로 주입한다(단위 test와 정반대다).
    applyDotEnv(it)
    // 탐침의 표본·기간을 밖에서 준다. gradle의 -D는 gradle JVM에만 닿으므로 명시적으로 넘긴다.
    // 결손 종목을 겨냥해 다시 잴 때 쓴다 — 표본을 코드에 박으면 그때마다 커밋에 섞인다.
    ['probe.tickers', 'probe.annualYear', 'probe.annualReport',
     'probe.quarterYear', 'probe.quarterReport'].each { key ->
        if (System.getProperty(key)) {
            systemProperty key, System.getProperty(key)
        }
    }
    // 실패해도 나머지를 계속 돌려 어느 소스가 깨졌는지 한 번에 본다.
    ignoreFailures = false
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    // 캐시된 성공 결과를 재사용하면 "지금도 살아 있는가"를 확인할 수 없다.
    outputs.upToDateWhen { false }
}

// 시점 재현 하네스(@Tag("backtest"))는 외부 API를 부르지 않는다. 대신 **운영 DB를 읽고**
// as-of마다 전 종목의 지표를 인메모리로 다시 계산하므로 한 번 도는 데 30분~2시간이다.
// 기본 test에서 빼는 이유가 그 소요와 운영 DB 의존 둘이다.
//
// MUST NOT: `.env`를 주입하지 않는다(applyDotEnv 없음). 외부 호출이 0이라 키가 필요 없고,
// 주입하면 @ConditionalOnApiKey 어댑터가 등록되어 **빈 구성이 달라진다** — 무엇이 호출되는지
// 알 수 없게 되는 것이 백테스트에서 특히 나쁘다. DB 접속은 application-backtest.yaml의
// 기본값이 답하므로 시크릿이 필요 없다.
//
// MUST NOT: @Tag("live")로 대신하지 않는다. 그쪽은 .env를 주입하고, 매 관통테스트마다
// 이 몇 시간짜리 하네스가 딸려 붙는다.
tasks.register('backtestProbe', Test) {
    group = 'verification'
    description = '운영 DB를 읽기 전용으로 보고 as-of 지표를 다시 계산하는 시점 재현 하네스.'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'backtest'
    }
    ignoreFailures = false
    testLogging {
        events 'passed', 'skipped', 'failed'
        showStandardStreams = true
    }
    // 힙. 기본값(512m)에서 OutOfMemoryError를 실측했다(350종목 × 1,441일자를 한 번에 든
    // 계산에서). 그 계산은 기각돼 지웠고, **지금 경로가 512m에서 도는지는 안 쟀다** —
    // 3.6시간짜리 적재가 힙으로 죽는 것이 가장 비싼 실패라 착수 전 시험까지 남겨 둔다.
    maxHeapSize = '8g'
    // 스윕 구간을 테스트 JVM으로 넘긴다. Gradle의 `-D`는 **데몬 JVM에만** 붙으므로 이 전달이
    // 없으면 `-Dsweep.from=`이 조용히 무시되고 기본 구간(1년)이 돈다 — 6일만 보려던 실행이
    // 몇 시간짜리가 되는데 아무 경고도 나지 않는다.
    ['sweep.from', 'sweep.to', 'pit.from', 'pit.to', 'pit.days', 'pit.dryRun'].each { key ->
        if (System.getProperty(key) != null) {
            systemProperty key, System.getProperty(key)
        }
    }
    // 저장소 경로. `PitStore.fromEnvironment()`가 읽는 환경변수가 셸에서 데몬을 거쳐
    // 워커까지 닿는지 재보지 않았으므로, 있으면 명시적으로 넘긴다 — `-D`가 데몬에만 붙는
    // 함정을 이미 한 번 겪은 자리라 같은 모양을 되풀이하지 않는다.
    if (System.getenv('PIT_STORE_DIR') != null) {
        environment 'PIT_STORE_DIR', System.getenv('PIT_STORE_DIR')
    }
    // 캐시된 성공을 재사용하면 적재 뒤에도 옛 결과를 보게 된다.
    outputs.upToDateWhen { false }
}

tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'live', 'backtest'
    }
}

// macOS Finder가 병합 시 만드는 "이름 2.java" 복제본을 잡는다. javac는 파일명이 아니라
// **/*.java 패턴으로 소스를 모으므로 복제본을 그대로 컴파일해 duplicate class를 낸다.
// 실제로 복제본 42개가 커밋되어 빌드가 멈춘 적이 있고(1873cf3), 에러가 duplicate class
// 27건으로 흩어져 나와 원인이 파일명이라는 것을 알아내기까지 시간이 걸렸다.
// fileTree 대신 traverse를 쓰는 이유는 빈 디렉토리도 잡기 위해서다 —
// 같은 사고에서 "collector 2" 같은 빈 디렉토리 10개가 함께 생겼다.
tasks.register('checkDuplicateFiles') {
    group = 'verification'
    description = '복제 파일·디렉토리("이름 2.java")를 검출해 duplicate class 전에 멈춘다.'
    doLast {
        def collect = { File root ->
            def found = []
            if (root.exists()) {
                root.traverse { f ->
                    if (f.name ==~ /.* \d+(\..+)?$/) {
                        found << relativePath(f)
                    }
                }
            }
            return found.sort()
        }

        def sourceDupes = collect(file('src'))
        if (sourceDupes) {
            throw new GradleException(
                    "복제 파일이 있다. 삭제하고 다시 빌드하라:\n" +
                    sourceDupes.collect { "  ${it}" }.join('\n'))
        }

        // 빌드 산출물에도 같은 일이 생긴다. 그때의 증상은
        // "Could not execute test class 'X 2' (wrong name: X)"인데, 그 문구만 보고 원인이
        // 파일 복제라는 것을 알아내기까지 시간이 걸린다 — 실제로 걸렸다. 여기서 먼저 가른다.
        // src와 처방이 다르다: 산출물은 지우는 게 아니라 clean으로 다시 만든다.
        def buildDupes = collect(file('build/classes')) + collect(file('build/resources'))
        if (buildDupes) {
            throw new GradleException(
                    "빌드 산출물에 복제본이 있다. `./gradlew clean` 후 다시 빌드하라.\n" +
                    "그대로 두면 테스트가 'wrong name' 오류로 실패하고 원인이 드러나지 않는다:\n" +
                    buildDupes.collect { "  ${it}" }.join('\n'))
        }
    }
}
tasks.named('check') { dependsOn 'checkDuplicateFiles' }
// 산출물 검사가 의미를 가지려면 컴파일 뒤·테스트 앞에 와야 한다. 순서를 못박지 않으면
// Gradle이 test를 먼저 돌릴 수 있고, 그러면 정작 막으려던 'wrong name' 오류가 먼저 난다.
// 단독 실행(./gradlew checkDuplicateFiles) 시에는 testClasses가 그래프에 없어 무시된다.
tasks.named('checkDuplicateFiles') { mustRunAfter 'testClasses' }
tasks.named('test') { mustRunAfter 'checkDuplicateFiles' }
// 프론트 단위 테스트를 check에 건다. 별도 명령으로 두면 ./gradlew build가 초록불인데
// 재시도 판별·CSRF 헤더 같은 눈에 안 보이는 로직이 깨진 채로 남는다.
tasks.named('check') { dependsOn 'frontendTest' }
