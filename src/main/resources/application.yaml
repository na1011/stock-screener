spring:
  application:
    name: stock-screener

  lifecycle:
    # 종료할 때 "도는 작업이 끝나기를" 기다리는 상한이다. **끝나기를 기다리는 시간이 아니라
    # 포기하기까지의 시간이다** — 배치는 시간 단위로 도므로 이 상한은 언제나 다 쓰인다.
    #
    # MUST: ops/stop.sh의 앱 대기(45초)보다 확실히 짧아야 한다. Boot 기본값 30초는 그 대기가
    # 30초이던 시절과 정확히 겹쳐, 배치가 도는 중에 끄면 stop.sh가 정상 종료를 실패로 오판했다.
    # 그러면 ops/deploy.sh의 set -e가 거기서 멈춰 재기동에 도달하지 못하고, 앱은 이미 SIGTERM을
    # 받았으므로 아무것도 안 도는 상태로 끝난다(실측 30,061ms — ADR-0078).
    #
    # 이 값과 ops/stop.sh의 45초는 **짝**이다. 한쪽만 고치면 배포가 조용히 깨진다.
    timeout-per-shutdown-phase: 15s

  task:
    scheduling:
      pool:
        # IMPORTANT — 이것이 배치끼리 안 겹치는 **유일한** 근거다. PipelineScheduler의 네
        # 스케줄(13:30 일일 갱신 · 14:00 기업 행위 사슬 · 14:15 무거운 잡 · 15:30 신선도)은
        # 서로 겹치면 안 되는데 잠금이 따로 없다 — 앞이 길어지면 뒤가 밀리는 것으로 족하다.
        #
        # Boot 기본값도 1이지만 명시한다. 기본값에 기대면 업그레이드가 조용히 뒤집을 수 있고,
        # 겹쳤을 때의 증상은 "어느 날 두 잡이 같은 종목의 price_daily를 함께 썼다"라 뒤늦게야
        # 드러난다. SchedulerEnabledContextTest가 이 값을 못박는다.
        #
        # MUST NOT: spring.threads.virtual을 켜지 않는다 — 켜면 이 크기가 무시된다.
        size: 1

  datasource:
    # MUST NOT: 실제 자격증명을 이 파일에 넣지 않는다. 환경변수로만 다룬다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_screener}
    username: ${DB_USERNAME:na1011}
    password: ${DB_PASSWORD:}
    hikari:
      # 지표 백필이 종목 루프를 팬아웃하고(ADR-0138) 워커 하나가 커넥션 하나를 계산하는 내내
      # 쥔다 — IndicatorRunner.run이 통째로 REQUIRES_NEW 안에서 돌기 때문이다(ADR-0007).
      # Boot 기본값 10이면 워커 상한이 8로 깎인다.
      #
      # IMPORTANT — 이 값은 **두 JVM에 걸린다.** 운영 앱(:8080)과 bootstrap 프로파일의 별도
      # 프로세스(server.port: 0이라 8080에 안 부딪힌다)가 각각 이 크기의 풀을 연다.
      #
      # **상한이지 상시값이 아니다** — 아래 `minimum-idle: 0`이 유휴를 걷는다. 적재 러너가
      # 함께 돌면 두 JVM 합쳐 최대 24이고, PostgreSQL max_connections가 100이라 여유는 크다.
      #
      # MUST NOT: 워커 수를 이 값에 맞춰 올리지 않는다. 상한을 정하는 것은 코어 유보이고
      # (IndicatorBackfillJob.resolveWorkers), 이 기계에는 운영 앱이 온디바이스로 함께 산다.
      maximum-pool-size: 12

      # **종료 순서 때문에 둔다.** 이 값이 없으면 Hikari 기본이 minimumIdle =
      # maximumPoolSize라 위 주석대로 12를 상시 문다. postgres의 smart shutdown은 그 12가
      # 끊길 때까지 기다리는데 **앱은 DB보다 늦게 SIGTERM을 받는다** — 2026-09-25에 앱이
      # 풀을 닫은 것이 63.1초, launchd의 종료 예산이 60초라 3.1초가 모자랐고, postmaster가
      # 강제 종료되며 남긴 postmaster.pid가 다음 부팅에서 PID 재사용을 만나 DB가 안 떴다
      # (ADR-0163 §배경). 유휴가 0이면 기다릴 대상이 없어 smart shutdown이 즉시 끝난다.
      #
      # **사정거리: 배치가 도는 중의 종료는 이걸로 안 막는다** — 그때는 활성 커넥션이고
      # idle-timeout의 대상이 아니다. 그 갈래는 ADR-0163의 락 판정이 결과를 받는다.
      #
      # MUST NOT: 이 값을 지우고 maximum-pool-size만 남기지 않는다. 지워도 앱은 정상
      # 기동하고 테스트도 통과하며, 증상은 **다음 재부팅에서 DB가 안 뜨는 것**으로 나온다.
      minimum-idle: 0

  mvc:
    problemdetails:
      # MUST: 켠 채로 둔다. Boot 4 기본값은 false이고, 끄면 프레임워크가 던지는 예외
      # (잘못된 JSON, 지원하지 않는 메서드)만 다른 형식으로 나간다. 프론트가 오류 응답을
      # 두 가지 모양으로 다뤄야 하고, 그 사실은 흔치 않은 경로에서만 드러난다.
      enabled: true

  jpa:
    hibernate:
      # 스키마의 정본은 Flyway 마이그레이션이다. Hibernate는 검증만 한다.
      # 엔티티와 스키마가 어긋나면 쿼리 시점이 아니라 기동 시점에 드러난다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    # MUST NOT: 실제 계정·앱 비밀번호를 여기 넣지 않는다. 환경변수 참조만 둔다.
    #
    # host를 비워두지 않고 기본값을 적는 이유는, 비어 있으면 Boot가 JavaMailSender 자체를
    # 만들지 않아 "메일 채널이 왜 비활성인가"의 원인이 자격증명 미설정인지 자동설정 미동작인지
    # 구분되지 않기 때문이다. 채널 활성 판정은 stockscreener.alert.mail.from 하나로만 한다.
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          # 기본값은 무한대다. 응답하지 않는 SMTP 하나가 배치 스레드를 영원히 붙잡으면
          # 그날 밤 배치가 통째로 사라지고, 실패로도 기록되지 않는다.
          connectiontimeout: 5000
          timeout: 10000
          writetimeout: 10000

  security:
    oauth2:
      client:
        registration:
          google:
            # MUST NOT: 실제 클라이언트 ID·시크릿을 이 파일에 넣지 않는다. 환경변수로만 주입한다.
            #
            # 기본값이 빈 문자열이 아니라 자리표시자인 이유: Spring Security의
            # OAuth2ClientWebMvcSecurityConfiguration이 @EnableWebSecurity 시점에 생성되며
            # ClientRegistration을 요구한다. 빈 값이면 등록이 만들어지지 않아 컨텍스트 기동이
            # 실패하고, 필터 체인에서 조건부로 우회할 수도 없다(그 시점보다 먼저 생성된다).
            # 자리표시자를 두면 자격증명 발급 전에도 애플리케이션이 정상 기동해
            # 인가 로직·API·배치를 개발·검증할 수 있다. 실제 로그인만 동작하지 않는다.
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - openid
              - email
              - profile

# ── 서버 ──────────────────────────────────────────────────────
server:
  # MUST: cloudflared 뒤에 있는 한 이 값을 지우거나 NONE으로 되돌리지 않는다.
  # cloudflared는 로컬 :8080에 **평문 HTTP**로 붙고 원래 스킴은 X-Forwarded-Proto에만 남는다.
  # 기본값(NONE)이면 Spring이 그 헤더를 무시해 redirect_uri를 http://screener.na1011.net/...
  # 으로 만들고, 등록된 것은 https://...이므로 Google이 redirect_uri_mismatch를 낸다.
  # 호스트는 맞고 스킴만 달라서 화면만 봐서는 원인이 보이지 않는다(ADR-0035).
  # localhost 직접 접속에는 이 헤더가 없으므로 로컬 개발 동작은 그대로다.
  forward-headers-strategy: framework

# ── 로그 레벨 ───────────────────────────────────────────────────
# 종목 루프 안에서 종목당 한 줄을 내던 로거를 DEBUG로 내렸다. 그 줄들은 지우지 않고
# 레벨만 낮췄으므로 **다시 켤 수단이 있어야 「강등」이 「삭제」와 갈린다.**
#
# actuator의 loggers 엔드포인트는 안 연다(management.endpoints가 health 하나다 — ADR-0031).
# 그래서 환경변수로 둔다. run-app.sh가 `set -a`로 .env를 export하므로
# **.env에 한 줄 + 재기동**이면 켜진다. 재스테이징도 재빌드도 필요 없다.
#
#   LOG_ADJUSTMENT=DEBUG    # 종목별 두 줄 — 「수정계수가 이미 원장과 일치한다」와
#                           # 「상장주식수가 없어 후보로 올리지 않았다」. 둘은 한 스위치에
#                           # 묶인다(키가 클래스 단위라 하나만 못 켠다).
logging:
  level:
    com.stockscreener.pipeline.collector.AdjustmentRecalculator: ${LOG_ADJUSTMENT:INFO}

# ── 에러 트래킹 ─────────────────────────────────────────────────
# MUST NOT: 실제 DSN을 여기 넣지 않는다. 환경변수 참조만 둔다.
#
# SentryAutoConfiguration은 @ConditionalOnProperty(name = "sentry.dsn")이다. 아래처럼
# 기본값을 빈 문자열로 두면 키가 없어도 프로퍼티는 "존재"해 자동설정이 켜지고, SDK가
# 빈 DSN을 비활성으로 다뤄 수집만 꺼진다. 애플리케이션은 그대로 뜬다.
#
# 자체 알림(배치 실패·워치리스트)과 역할이 다르다. 자체 알림은 코드가 예상한 사건을,
# Sentry는 예상 못 한 예외와 **알림 코드 자체가 죽은 경우**를 잡는다. 후자 때문에
# 아래 logging 설정을 끄지 않는다 — CompositeAlertPort의 채널 실패는 log.error로만 남고,
# 그 로그가 Sentry에 닿지 않으면 "알림이 갔다고 생각했는데 아무 데도 가지 않은" 상태를
# 알려줄 경로가 하나도 없다.
sentry:
  dsn: ${SENTRY_DSN:}
  # 로컬 bootRun과 launchd 운영 인스턴스의 이슈가 섞이지 않게 한다.
  # 운영 값은 ops/run-app.sh가 production으로 덮는다.
  environment: ${SENTRY_ENVIRONMENT:local}
  # MUST: false로 둔다. 켜면 요청 헤더·쿠키와 함께 로그인 이메일이 Sentry로 나간다.
  # 기본값이지만 명시한다 — 기본값에 기대면 SDK 업그레이드가 조용히 뒤집을 수 있다.
  send-default-pii: false
  logging:
    # ERROR 로그를 이벤트로 올린다. 위에 적은 "알림 코드가 죽은 경우"의 유일한 경로다.
    minimum-event-level: error
  # MUST NOT: traces-sample-rate를 켜지 않는다. 트레이싱은 무료 티어의 월 이벤트 총량을
  # 태우는데, 여기서 필요한 것은 예상 못 한 예외이지 성능 프로파일이 아니다.

# ── 운영 엔드포인트 ─────────────────────────────────────────────
# 존재 이유는 하나다 — 재부팅 뒤 밖에서 curl 한 번으로 "앱과 터널이 살아 있는가"를 묻는 것.
# 포트가 열렸는지만 보면 DB가 죽은 채 뜬 앱과 구분되지 않는다(ADR-0031).
management:
  endpoints:
    web:
      exposure:
        # health 하나만 연다. 나머지는 SecurityConfig가 관리자로 잠그지만, 노출 자체를
        # 좁혀 두면 그 매처가 잘못돼도 새어 나갈 것이 없다.
        include: health
  endpoint:
    health:
      # /actuator/health는 익명에게 열려 있다(SecurityConfig). 상세를 숨겨 {"status":"UP"}만
      # 나가게 한다 — 밖에서 살아 있는지 묻는 데는 그것으로 충분하고, DB 주소나 디스크
      # 용량까지 함께 나갈 이유는 없다.
      show-details: never
  health:
    mail:
      # MUST: 꺼 둔 채로 둔다. spring-boot-mail이 MailHealthContributorAutoConfiguration을
      # 함께 싣고, 그 인디케이터는 SMTP에 실제로 접속을 시도한다. 알림 자격증명이 없는 지금
      # 상태에서는 그것이 실패해 health가 통째로 503이 되고, launchd 워치독과 재부팅 검증이
      # 그 503을 "앱이 안 떴다"로 읽는다. 자격증명이 채워진 뒤에도 켜지 않는다 — 메일 서버가
      # 잠깐 느린 것과 앱이 죽은 것은 다른 사건이고, 여기서 섞으면 후자를 놓친다.
      enabled: false

# ── 애플리케이션 설정 ───────────────────────────────────────────
# MUST NOT: 이 블록을 둘로 나누지 않는다. 루트 키가 같은 매핑이 두 번 나오면 YAML은
# 뒤엣것으로 덮으므로, 앞 블록의 설정이 전부 조용히 사라진다.
stockscreener:

  # ── 알림 ──────────────────────────────────────────────────
  # spec §8이 "이메일과 메신저 두 채널 모두"를 요구한다. 값이 없으면 채널이 비활성이고
  # 알림은 로그로 떨어진다 — 애플리케이션은 그대로 기동한다(AlertConfig).
  #
  # MUST NOT: 실제 웹훅 URL을 여기 넣지 않는다. URL 자체가 자격증명이며,
  # 아는 사람은 누구나 그 채널에 글을 쓸 수 있다.
  alert:
    webhook:
      # Slack 형식으로 보낸다. Discord를 쓴다면 URL 끝에 /slack을 붙여야 한다 —
      # 붙이지 않으면 Discord가 400을 내고, 그 실패는 "채널에 아무것도 안 뜬다"로만 보인다.
      url: ${ALERT_WEBHOOK_URL:}
      # INFO는 정상 완료 통지다. 매일 성공 알림이 오면 곧 채널을 음소거하게 되고,
      # 그때부터 실패 알림도 함께 묻힌다.
      min-severity: WARNING
    mail:
      from: ${MAIL_USERNAME:}
      # 비우면 from을 그대로 쓴다. 발신 계정과 수신 계정이 다를 때만 채운다.
      operator-address: ${ALERT_OPERATOR_EMAIL:}
      # 운영자 알림에만 걸린다. 워치리스트(사용자 대상)는 심각도와 무관하게 나간다 —
      # 여기 걸면 INFO인 워치리스트 알림이 통째로 사라진다.
      min-severity: ERROR
    # 짧은 간격의 재실행이 같은 알림을 반복해 채널을 덮는 것을 막는다.
    # 일일 배치는 하루 한 번이라 이 창에 걸리지 않는다.
    suppression-window: 10m

  # ── 외부 데이터 소스 ────────────────────────────────────────
  # MUST NOT: 실제 키를 여기 넣지 않는다. 환경변수 참조만 둔다.
  # 키가 비어 있어도 애플리케이션은 기동하며, 어댑터가 조회 시점에 AUTH로 실패한다 —
  # 키 없이도 나머지 파이프라인을 개발·검증할 수 있어야 하기 때문이다.
  datasource:
    data-go-kr:
      base-url: https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService
      api-key: ${DATA_GO_KR_SERVICE_KEY:}
      # 공식 가이드 기준 초당 최대 30 TPS. 배치는 급할 이유가 없으므로 훨씬 낮게 잡는다.
      # 경계에서 차단당하는 것보다 조금 느린 편이 낫다.
      permits-per-minute: 300
      # 활용신청 계정마다 다르다. 실측 후 조정한다.
      daily-quota: 9000
    dart:
      base-url: https://opendart.fss.or.kr/api
      api-key: ${DART_API_KEY:}
      # **분당 1,000회 이상이면 1시간 IP 차단**(2026-09-22 사용자가 알려준 오픈다트 안내).
      # 같은 날 실측이 그것을 뒷받침한다 — 탐침이 리미터 없이 약 765콜을 42초에 던져
      # **약 1,093 rpm**이 됐고 SocketException 뒤 호스트가 통째로 막혔다(google은 200).
      # 600은 임계의 60%다. **MUST NOT: 1,000에 붙이지 않는다** — 차단의 대가가 1시간이고
      # 그 사이 평일 배치 사슬이 통째로 실패한다.
      permits-per-minute: 600
      # 일 20,000건(2차 출처). 여유를 두고 잡는다.
      daily-quota: 18000
      # corpCode.xml은 3.5MB ZIP이라 기본 읽기 타임아웃으로는 부족할 수 있다.
      read-timeout: 60s
    alpaca:
      # Trading API다. 자산 마스터(/v2/assets)와 마켓 캘린더가 여기에 있다.
      base-url: https://paper-api.alpaca.markets
      # 시세(/v2/stocks/bars)는 base URL이 다르다(https://data.alpaca.markets). 섞으면 404이고
      # 인증 헤더가 두 계열 모두 같아서 "키가 틀렸다"로 읽히지 않는다. 키는 아래 둘을 공유한다.
      #
      # MUST NOT: 그 두 번째 base URL을 이 블록 안에 키로 두지 않는다. `Source`에 세터가 없어
      # ignoreUnknownFields 기본값이 조용히 삼키고, 그 줄은 아무 일도 하지 않으면서 설정처럼
      # 보인다 — 실제로 그 상태였고 자바 기본값과 값이 같아 증상이 없었다.
      # 값은 DataSourceProperties.alpacaMarketDataBaseUrl에 있다(dataGoKrMarketIndexBaseUrl과
      # 같은 형태다). DataSourcePropertiesBindingTest가 이 함정을 잠근다.
      # 이 소스만 키가 둘이다. api-key가 Key ID, secret-key가 Secret Key다.
      api-key: ${APCA_API_KEY_ID:}
      secret-key: ${APCA_API_SECRET_KEY:}
      # MUST: 이 두 줄이 없으면 @ConditionalOnApiKey가 Environment에서 값을 못 찾아
      # 어댑터가 영영 등록되지 않는다. DataSourceProperties의 필드 기본값은 Environment에
      # 없고, .env의 APCA_API_KEY_ID는 relaxed binding으로도 이 이름에 닿지 않는다.
      #
      # 공표된 200/분은 Market Data API의 값이고 Trading API의 자체 한도는 확인한 적이 없다.
      # 착수 판단은 공표값의 절반으로 한다(api-sources skill). 유니버스는 실행당 1콜이라
      # 어느 쪽이든 닿지 않는다.
      permits-per-minute: 100
      # 일일 총량은 공표값이 없다. 0은 무제한이다.
      #
      # 시세가 붙었으니 이 값을 한 번 판단했다: 그대로 0으로 둔다. 근거는 셀 기준이 없다는
      # 것이다 — 벤더가 일일 총량을 공표하지 않아 어떤 수를 넣어도 우리가 지어낸 값이고,
      # 지어낸 상한은 소진되는 날 "쿼터 초과"라는 **거짓 원인**을 남긴다. 실제로 우리를 막는
      # 것은 위의 분당 한도이고 그쪽은 공표값이 있다.
      # MUST NOT: 전량 적재 비용을 이 값으로 막으려 하지 않는다. 그것은 대상 선정이 정한다.
      daily-quota: 0
      # 활성 종목 전량이 한 응답에 온다(실측 3.88MB). 페이징 파라미터가 없어 나눠 받을 수 없다.
      read-timeout: 60s
    sec-edgar:
      base-url: https://data.sec.gov
      # IMPORTANT — 여기 들어가는 것은 시크릿이 아니라 신원 표시다. EDGAR는 키를 발급하지 않고
      # User-Agent(`<이름> <이메일>`)만 요구하는데, @ConditionalOnApiKey가 `.api-key` 하나만
      # 보므로 그 자리를 쓴다. 비면 어댑터가 등록되지 않고 미국 재무를 받으려 할 때
      # "재무 소스가 등록되지 않았다"로 실패한다.
      #
      # MUST: 이 줄이 없으면 @ConditionalOnApiKey가 Environment에서 값을 못 찾아 어댑터가
      # 영영 등록되지 않는다 — alpaca 블록의 같은 주석과 같은 이유다.
      api-key: ${SEC_EDGAR_USER_AGENT:}
      # 공표는 초당 10회다. 착수 판단은 공표값의 절반으로 한다(api-sources skill).
      # 리미터는 60_000/이 값으로 균등 간격을 내므로 300이면 200ms, 곧 초당 5회다.
      permits-per-minute: 300
      # 일일 총량 공표값이 없다. 0은 무제한이다 — 지어낸 상한은 소진되는 날 "쿼터 초과"라는
      # 거짓 원인을 남긴다(alpaca와 같은 판단).
      daily-quota: 0
      # 한 종목 응답이 최대 7.9MB다(실측, sec-edgar-financial.md).
      read-timeout: 60s

# ── 적재 프로파일 ───────────────────────────────────────────────
# MUST: devtools 재기동을 꺼 둔다. 적재는 몇 시간을 도는데 devtools는 classpath가 바뀌면
# 프로세스를 재기동하고, 그러면 BootstrapRunner가 **처음부터 다시** 간다. 트리거는 "의도한
# 재컴파일"이 아니라 build/classes·build/resources/main을 건드리는 아무 gradle 태스크다 —
# processResources가 frontendBuild에 걸려 있어 프론트 경유 태스크까지 포함된다. 적재가
# 도는 동안 그것을 하나라도 돌리면 조용히 처음으로 돌아가고, 화면에는 단서가 없다.
#
# 이 프로파일에서만 끄므로 평소 개발 bootRun의 핫리로드는 그대로다.
#
# 참고 — yaml로 끄면 재기동은 사라지지만 restart 클래스로더 초기화 자체는 남는다(Spring
# 문서). 없애려는 것이 재기동이므로 충분하다. "덜 껐다"고 보고 시스템 프로퍼티로 옮기지
# 않는다 — 그러면 bootRun 인자에 섞여 프로파일과 따로 놀게 된다.
---
spring:
  config:
    activate:
      on-profile: bootstrap
  devtools:
    restart:
      enabled: false

# BootstrapDatabaseGuard가 기동 시점에 **연결된** 데이터베이스와 대조한다. 기본값이 운영 이름이라
# 아무것도 안 주면 「운영을 의도했다」를 단언하는 것이고 기존 명령은 그대로 돈다. 임시 DB로
# 돌리려면 DB_URL과 BOOTSTRAP_DB를 **둘 다** 그 이름으로 맞춰야 하고, 한쪽만 주면 기동이 선다.
#
# MUST NOT: 이 자리에 DB_NAME을 쓰지 않는다. 그것은 `ops/`가 psql로 배치를 물을 때만 쓰는 값이고
# (`.claude/rules/config.md`), 여기서 재사용하면 그 문장이 거짓이 된다.
pipeline:
  bootstrap:
    expected-database: ${BOOTSTRAP_DB:stock_screener}

# 운영 앱이 8080에 떠 있는 채로 적재·판정을 돌리는 것이 정상 사용 조건이라 포트를 비운다.
# 손으로 `--server.port=0`을 주는 것으로는 안 된다 — 빠뜨리면 컨텍스트가 포트 충돌로 죽는데
# **그때 BootstrapRunner는 아예 시작되지 않아** 그 실패 처리가 걸리지 않고, gradle은
# BUILD SUCCESSFUL과 종료코드 0을 낸다(실측). 즉 아무 일도 안 일어난 실행이 성공으로 읽힌다.
#
# MUST NOT: 이 문서에 `server:` 매핑을 두 번 두지 않는다. YAML은 같은 문서의 같은 루트 키를
# 뒤엣것으로 덮으므로 앞 블록이 조용히 사라지는데, 잃는 것이 위 문서의
# `forward-headers-strategy`면 **로컬·테스트는 멀쩡하고 도메인 로그인만 깨진다** — 그 값의
# 근거는 위 문서의 `server:` 블록 주석에 있다.
server:
  port: 0
