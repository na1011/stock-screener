spring:
  application:
    name: stock-screener

  datasource:
    # MUST NOT: 실제 자격증명을 이 파일에 넣지 않는다. 환경변수로만 다룬다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_screener}
    username: ${DB_USERNAME:na1011}
    password: ${DB_PASSWORD:}

  jpa:
    hibernate:
      # 스키마의 정본은 Flyway 마이그레이션이다. Hibernate는 검증만 한다.
      # 엔티티와 스키마가 어긋나면 쿼리 시점이 아니라 기동 시점에 드러난다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
