spring:
  application:
    name: stock-screener

  datasource:
    # MUST NOT: 실제 자격증명을 이 파일에 넣지 않는다. 환경변수로만 다룬다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_screener}
    username: ${DB_USERNAME:na1011}
    password: ${DB_PASSWORD:}

  mvc:
    problemdetails:
      # MUST: 켠 채로 둔다. Boot 4 기본값은 false이고, 끄면 프레임워크가 던지는 예외
      # (잘못된 JSON, 지원하지 않는 메서드)만 다른 형식으로 나간다. 프론트가 오류 응답을
      # 두 가지 모양으로 다뤄야 하고, 그 사실은 흔치 않은 경로에서만 드러난다.
      enabled: true

  jpa:
    hibernate:
      # 스키마의 정본은 Flyway 마이그레이션이다. Hibernate는 검증만 한다.
      # 엔티티와 스키마가 어긋나면 쿼리 시점이 아니라 기동 시점에 드러난다.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  batch:
    # IMPORTANT — Boot 4.1에는 spring.batch.jdbc.* 속성이 없다. BatchProperties에 job 항목만
    # 있어 initialize-schema 같은 Boot 3 속성을 여기 적으면 조용히 무시된다.
    # 더 중요한 것은 Boot 4.1이 JDBC JobRepository를 자동 구성하지 않는다는 점이다 —
    # 기본값은 인메모리(ResourcelessJobRepository)이고, 그대로 두면 잡은 정상 동작하는데
    # 아무것도 기록되지 않아 재시작이 불가능하다. BatchInfrastructureConfig가 이를 대체한다.
    # 스키마는 Flyway V6가 만든다.
    job:
      # MUST: 기동 시 잡을 자동 실행하지 않는다. 초기 적재는 1회성 수동 작업이고,
      # 일일 갱신은 스케줄러가 정해진 시각에 띄운다. 이것을 켜두면 애플리케이션을
      # 재시작할 때마다 850종목 수집이 시작된다.
      enabled: false

  security:
    oauth2:
      client:
        registration:
          google:
            # MUST NOT: 실제 클라이언트 ID·시크릿을 이 파일에 넣지 않는다. 환경변수로만 주입한다.
            #
            # 기본값이 빈 문자열이 아니라 자리표시자인 이유: Spring Security의
            # OAuth2ClientWebMvcSecurityConfiguration이 @EnableWebSecurity 시점에 생성되며
            # ClientRegistration을 요구한다. 빈 값이면 등록이 만들어지지 않아 컨텍스트 기동이
            # 실패하고, 필터 체인에서 조건부로 우회할 수도 없다(그 시점보다 먼저 생성된다).
            # 자리표시자를 두면 자격증명 발급 전에도 애플리케이션이 정상 기동해
            # 인가 로직·API·배치를 개발·검증할 수 있다. 실제 로그인만 동작하지 않는다.
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - openid
              - email
              - profile

# ── 외부 데이터 소스 ────────────────────────────────────────────
# MUST NOT: 실제 키를 여기 넣지 않는다. 환경변수 참조만 둔다.
# 키가 비어 있어도 애플리케이션은 기동하며, 어댑터가 조회 시점에 AUTH로 실패한다 —
# 키 없이도 나머지 파이프라인을 개발·검증할 수 있어야 하기 때문이다.
stockscreener:
  datasource:
    data-go-kr:
      base-url: https://apis.data.go.kr/1160100/service/GetStockSecuritiesInfoService
      api-key: ${DATA_GO_KR_SERVICE_KEY:}
      # 공식 가이드 기준 초당 최대 30 TPS. 배치는 급할 이유가 없으므로 훨씬 낮게 잡는다.
      # 경계에서 차단당하는 것보다 조금 느린 편이 낫다.
      permits-per-minute: 300
      # 활용신청 계정마다 다르다. 실측 후 조정한다.
      daily-quota: 9000
    dart:
      base-url: https://opendart.fss.or.kr/api
      api-key: ${DART_API_KEY:}
      # 분당 제한이 공식 문서에 없어 보수적으로 잡는다.
      permits-per-minute: 600
      # 일 20,000건(2차 출처). 여유를 두고 잡는다.
      daily-quota: 18000
      # corpCode.xml은 3.5MB ZIP이라 기본 읽기 타임아웃으로는 부족할 수 있다.
      read-timeout: 60s
