spring:
  datasource:
    # 전용 테스트 DB. 운영·개발 DB와 절대 공유하지 않는다.
    # 이름이 _test를 포함하는지 TestDatabaseGuard가 기동 시 단언한다.
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/stock_screener_test}
    username: ${TEST_DB_USER:na1011}
    password: ${TEST_DB_PASSWORD:}
    hikari:
      # IMPORTANT — 테스트 컨텍스트마다 별도의 커넥션 풀이 생기고, Spring TestContext는
      # 컨텍스트를 캐시하며 닫지 않는다. 기본값 10으로 두면 서로 다른 설정의 테스트 클래스가
      # 늘어날수록 풀이 누적되어 PostgreSQL의 max_connections(기본 100)를 넘고,
      # "sorry, too many clients already"로 무관한 테스트가 실패하기 시작한다.
      # 그 실패는 원인이 드러나지 않아 방금 만든 코드의 결함으로 오해하기 쉽다.
      # 테스트는 단일 스레드로 돌므로 커넥션이 여러 개일 이유가 없다.
      maximum-pool-size: 2
      minimum-idle: 0
      # 유휴 커넥션을 빨리 반납해 캐시된 컨텍스트가 자리를 붙잡고 있지 않게 한다.
      idle-timeout: 10000

  jpa:
    hibernate:
      # 스키마의 정본은 Flyway다. 테스트도 같은 마이그레이션을 실행해
      # 엔티티와 스키마의 어긋남이 기동 시점에 드러나게 한다.
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    # 테스트 전용 마이그레이션을 함께 적용한다. QueryDSL 프로브 테이블은 도메인이 아니므로
    # 운영 스키마에 넣지 않지만, ddl-auto: validate 아래에서는 테이블이 존재해야 한다.
    locations: classpath:db/migration,classpath:db/testmigration
    # 테스트 전용 V900이 항상 운영 마이그레이션보다 위에 있으므로, 새 운영 버전(V5·V6…)은
    # 이미 적용된 V900보다 "낮은" 번호로 뒤늦게 들어온다. Flyway는 기본적으로 이것을
    # 순서 위반으로 보고 검증에 실패한다.
    # MUST: 테스트 프로파일에서만 허용한다. 운영에서 순서를 건너뛴 적용을 허용하면
    # 마이그레이션이 실제로 어떤 순서로 돌았는지 알 수 없게 된다.
    out-of-order: true
    clean-disabled: false
    # Phase 1 동안은 마이그레이션을 자유롭게 수정한다(데이터가 없으므로 안전하다).
    # 체크섬이 바뀌어도 테스트가 막히지 않도록 검증 실패 시 스키마를 비우고 다시 적용한다.
    # 대상은 이름에 _test가 들어간 DB뿐이다(TestDatabaseGuard가 기동 시 단언).
    # MUST: Phase 2에서 초기 적재를 실행한 이후에는 이 설정을 제거한다.
    clean-on-validation-error: true

  security:
    oauth2:
      client:
        registration:
          google:
            # 테스트용 자리표시자. 실제 Google 호출은 하지 않는다 —
            # 인가 로직은 합성 OidcUser로 검증하므로 자격증명이 필요 없다.
            # 값이 있어야 하는 이유는 Spring Security의 OAuth2 클라이언트 설정이
            # ClientRegistrationRepository를 요구하며 @EnableWebSecurity 시점에 생성되기 때문이다.
            client-id: test-client-id
            client-secret: test-client-secret
            scope: [openid, email, profile]

logging:
  level:
    org.hibernate.SQL: debug
