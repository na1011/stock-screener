# 시점 재현 하네스 전용 프로파일(P17, ADR-0071).
#
# 다른 테스트와 정반대다 — `application-test.yaml`은 전용 테스트 DB를 쓰지만 여기는
# **운영 DB를 읽는다.** 백테스트가 필요로 하는 시세·재무가 거기에만 있고, 테스트 DB는
# 전 테이블 0행이라 원리적으로 답할 수 없는 물음이다.
#
# 그래서 방어의 방향도 반대다. 저쪽은 `TestDatabaseGuard`가 "이름에 _test가 있는가"를 묻고,
# 이쪽은 `ReadOnlyDatabaseGuard`가 "쓰기가 실제로 거부되는가"를 묻는다.
spring:
  datasource:
    # IMPORTANT — `readOnlyMode=always`가 이 파일에서 가장 중요한 한 글자다.
    #
    # pgjdbc 기본값은 `transaction`이고, 그 모드에서 `Connection.setReadOnly(true)`는
    # **autoCommit이 꺼져 있을 때만** `BEGIN READ ONLY`를 낸다. `JdbcTemplate`의 기본은
    # autocommit이므로 아래 `hikari.read-only`만으로는 **아무 SQL도 나가지 않는다.**
    # 접속 롤이 superuser이고 서버의 `default_transaction_read_only`가 off라, 그 상태에서
    # 하네스가 `IndicatorRunner.run()`을 잘못 부르면 운영 `indicator_value`에 그대로 쓴다.
    #
    # `always`는 접속 직후 `SET SESSION CHARACTERISTICS AS TRANSACTION READ ONLY`를 보내
    # 암묵 트랜잭션까지 읽기 전용으로 만든다 — 쓰기는 SQLSTATE 25006으로 서버가 거부한다.
    #
    # MUST NOT: 이 값을 `${DB_URL}`에 문자열로 덧붙이지 않는다. DB_URL에 이미 질의문자열이
    # 있으면 `?`가 둘이 되어 조용히 깨진다. 통째로 바꿔 끼우는 변수를 따로 둔다.
    url: ${BACKTEST_DB_URL:jdbc:postgresql://localhost:5432/stock_screener?readOnlyMode=always}
    username: ${DB_USERNAME:na1011}
    password: ${DB_PASSWORD:}
    hikari:
      # 드라이버가 위 SET을 실제로 보내게 하는 방아쇠다. 위 URL 파라미터와 **둘 다** 필요하다.
      read-only: true
      # 하네스는 단일 스레드로 as-of를 순회한다. 풀을 키울 이유가 없다.
      maximum-pool-size: 2
      minimum-idle: 0

  # MUST: 끈 채로 둔다. 운영 스키마에 손대는 유일한 자동 경로다. 읽기 전용 접속에서는
  # 어차피 실패하지만, 실패가 "마이그레이션이 밀렸다"로 읽히면 진단이 한 단계 늘어난다.
  flyway:
    enabled: false

  jpa:
    hibernate:
      # MUST: `validate`가 아니라 `none`이다. 직관과 반대라 이유를 남긴다.
      #
      # 테스트 클래스패스에 `QuerydslProbeEntity`(ADR-0001의 Phase 1 하드 게이트)가 @Entity로
      # 있고, 그 테이블 `querydsl_probe`는 **테스트 전용 마이그레이션 V900에만** 있다.
      # 운영 스키마에는 없고 있어서도 안 된다. 그래서 운영 DB에 대한 `validate`는
      # **원리적으로 통과할 수 없다** — 실제로 `missing table [querydsl_probe]`로 기동이 죽었다.
      #
      # 잃는 것은 "엔티티와 스키마의 어긋남이 기동에서 드러난다"인데, 여기서는 그 대가가
      # 작다. 하네스가 읽는 경로(IndicatorDataReader·ScreeningRepository)는 JdbcTemplate과
      # 명시적 SQL이라 매핑이 아니라 쿼리가 정본이고, 어긋나면 컬럼 이름에서 바로 죽는다.
      ddl-auto: none
    open-in-view: false

  # 컨텍스트를 띄우는 것만으로 배치가 돌면 운영 데이터를 건드린다. 기본값이 이미 꺼짐이지만
  # 이 프로파일에서는 명시한다 — 기본값에 기대면 기본값이 바뀔 때 조용히 켜진다.
  batch:
    job:
      enabled: false

pipeline:
  scheduler:
    enabled: false

logging:
  level:
    # 하네스는 as-of마다 전 종목을 돈다. INFO로 두면 종목 수 × 시점 수만큼 줄이 나와
    # 정작 읽어야 할 집계가 묻힌다.
    com.stockscreener.indicator: WARN
    com.stockscreener.pipeline: WARN
