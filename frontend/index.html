<!doctype html>
<!-- app-dark는 PrimeVue의 darkModeSelector다(main.ts). 지우면 화면이 손보지 않은 라이트로 떨어진다. -->
<html lang="ko" class="app-dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!-- 번들 CSS를 파싱한 뒤에야 시작하면 서체 교체가 눈에 띄게 늦다. crossorigin은 동일
         출처라도 필수다 — 서체 요청은 항상 CORS 모드라 빠지면 프리로드가 버려진다. -->
    <link
      rel="preload"
      href="/fonts/PretendardVariable-1.3.9.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>주식 스크리너</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
